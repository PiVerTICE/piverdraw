<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PiVerDraw</title>
<meta name="description" content="PiVerDraw : un tableau blanc pour la classe, directement dans le navigateur.">
<meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1e26" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PiVerDraw">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>html{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#e8ecf2;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<style>
/* Mise en page : en-tête en haut, rail d'outils à gauche, scène centrale (canvas + barres flottantes),
   bandeau de pages à droite (sous la scène sur téléphone). Le papier reste clair ou sombre selon le fond choisi,
   seul le cadre de l'application suit le thème. */
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-brand:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#e8ecf2;
  --panel:#f5f7fa;
  --panel-2:#ffffff;
  --line:#d2d8e2;
  --ink:#1b2230;
  --muted:#586377;
  --hover:#e3e8f0;
  --accent:#0b7a75;
  --accent-ink:#ffffff;
  --accent-soft:#d5eeeb;
  --danger:#b3261e;--warn:#b85a0a;
  --desk:#dde3ec;
  --shadow:0 1px 2px rgba(20,30,50,.10),0 8px 22px rgba(20,30,50,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a;--panel:#1a1e26;--panel-2:#222731;--line:#303847;--ink:#e8ecf3;--muted:#9aa4b6;
    --hover:#2a3140;--accent:#3cc7bd;--accent-ink:#06211f;--accent-soft:#16413e;--danger:#ff8a80;--warn:#ff9f43;--desk:#0e1116;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a;--panel:#1a1e26;--panel-2:#222731;--line:#303847;--ink:#e8ecf3;--muted:#9aa4b6;
  --hover:#2a3140;--accent:#3cc7bd;--accent-ink:#06211f;--accent-soft:#16413e;--danger:#ff8a80;--warn:#ff9f43;--desk:#0e1116;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.4;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-columns:60px minmax(0,1fr) 156px;grid-template-rows:52px minmax(0,1fr);grid-template-areas:"head head head" "rail stage pages"}

/* En-tête */
.top{grid-area:head;display:flex;align-items:center;gap:6px;min-width:0;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:12}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
.brand svg{width:26px;height:26px}
.wordmark{font-family:var(--font-brand);font-weight:700;font-size:20px;letter-spacing:-.01em}
.name{width:clamp(110px,18vw,220px);height:32px;border:1px solid transparent;border-radius:8px;background:transparent;padding:0 8px;font-weight:500;text-overflow:ellipsis;-webkit-user-select:text;user-select:text}
.name:hover{border-color:var(--line)}
.name:focus{border-color:var(--accent);background:var(--panel-2);outline:none}
.save{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1 1 0;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:transparent;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.line{border-color:var(--line);background:var(--panel-2)}
.btn.line[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.narrow-only{display:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:none}
.menuwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:250px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:30}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:8px 10px;border:0;border-radius:7px;background:transparent;text-align:left}
.menu button:hover:not(:disabled){background:var(--hover)}
.menu button:disabled{opacity:.45;cursor:default}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu kbd,.help kbd{font-family:var(--font-mono);font-size:11px;background:var(--hover);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:auto}
.menu .ck{width:16px;flex:none;text-align:center;font-weight:600;color:var(--accent)}
.menu [aria-checked="true"] .ck::after{content:"✓"}
.menu .sub{display:block;padding:6px 10px 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Rail d'outils */
.rail{grid-area:rail;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;min-height:0}
.tool{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:10px;background:transparent;flex:none;position:relative}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rail .sep{width:26px;height:1px;margin:4px 0}

/* Scène */
.stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--desk);overflow:hidden}
#cv{position:absolute;inset:0;touch-action:none;display:block}
.props{position:absolute;top:10px;left:0;right:0;margin:0 auto;width:max-content;max-width:calc(100% - 20px);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px 12px;z-index:3}
.props .grp{display:flex;align-items:center;gap:6px}
.props .grp[data-g="sel"]{flex-wrap:wrap;justify-content:center}   /* petits écrans : la barre de sélection passe sur deux lignes au lieu d'être coupée */
.props label.lab{font-size:12px;color:var(--muted)}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel-2);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.swatch.custom{overflow:hidden;background:conic-gradient(#e33,#ea0,#3b3,#0bd,#44f,#d3d,#e33)}
.swatch.custom input{position:absolute;inset:-6px;opacity:0;cursor:pointer;width:40px;height:40px}
input[type=range]{accent-color:var(--accent);width:120px}
.val{font-family:var(--font-mono);font-size:12px;min-width:2.6em;text-align:right;color:var(--muted)}
.props select{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:0 6px}
.props .chk{display:flex;align-items:center;gap:6px;font-size:13px}
.props .chk input{accent-color:var(--accent);width:16px;height:16px}
.props .hint{font-size:13px;color:var(--muted)}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3;padding:2px}
.zoom .btn{height:30px;padding:0 7px}
.zoom .pct{font-family:var(--font-mono);font-size:12px;min-width:3.6em;text-align:center}
.toast{z-index:60;position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 140px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:6;font-size:13px}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:grid;place-items:center;font-weight:600;z-index:7;pointer-events:none}
.texted{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);outline-offset:3px;background:transparent;resize:none;overflow:hidden;white-space:pre;line-height:1.25;font-weight:500;font-family:'IBM Plex Sans',system-ui,sans-serif;z-index:4;-webkit-user-select:text;user-select:text;min-width:40px}

/* Pages */
.pages{grid-area:pages;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line);padding-right:env(safe-area-inset-right,0px)}
.pages-head{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:8px 8px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pages-head .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;width:100%}
.pages-head .btn{height:30px;padding:0 6px}
.thumbs{list-style:none;margin:0;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:12px;overflow-y:auto;min-height:0;flex:1}
.thumb{display:block;border:0;padding:0;background:transparent;text-align:center}
.thumb canvas{display:block;border-radius:4px;box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.12);background:#fff}
.thumb[aria-current="true"] canvas{box-shadow:0 0 0 3px var(--accent)}
.thumb .n{display:block;margin-top:4px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.thumb[aria-current="true"] .n{color:var(--ink);font-weight:500}

/* Boîtes de dialogue maison */
.veil{position:fixed;inset:0;background:rgba(10,14,22,.45);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{max-height:calc(100% - 8px);overflow:auto;width:min(440px,100%);background:var(--panel-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
.dlg h2{margin:0 0 8px;font-size:17px;font-family:var(--font-brand)}
.dlg p{margin:0 0 16px;color:var(--muted)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.help{width:min(520px,100%)}
.share{width:min(560px,100%)}
.dlg .lab{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.dlg .field{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-family:var(--font-mono);font-size:12px;-webkit-user-select:text;user-select:text}
.dlg .field:focus{border-color:var(--accent);outline:none}
.qrrow{display:flex;gap:6px;align-items:center}
.qrrow .field{flex:1;min-width:0}
.btn.sq{width:36px;height:36px;padding:0;justify-content:center;flex:none}
.qrhint{min-height:1.2em;margin:6px 0 10px;font-size:12px;color:var(--muted)}
.qrcolors{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 4px}
.qrsw{width:34px;height:34px;border-radius:9px;border:2px solid var(--panel-2);box-shadow:0 0 0 1px var(--line);padding:0}
.qrsw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.qrbox{display:grid;place-items:center;min-height:150px;margin:12px 0 6px;padding:10px;border:1px solid var(--line);border-radius:10px;color:#1b2230}
.qrbox.dark{color:#e8ecf3}
#qrCv{display:block;max-width:100%}
.qrmsg{margin:0;text-align:center;color:inherit;opacity:.8}
.qrenc{margin:0 0 10px;font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-user-select:text;user-select:text}
.dlg:focus{outline:none}
[hidden]{display:none!important}
.dlg .chk{display:flex;align-items:flex-start;gap:10px;margin:0 0 4px;padding:5px 0;font-size:14px;line-height:1.35;cursor:pointer;color:var(--ink)}
.dlg .chk input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
.dlg .chk small{display:block;margin-top:1px;font-size:12px;color:var(--muted)}
.dlg .chk.off{opacity:.55;cursor:default}
.dlg .chk.off input{cursor:default}
.linkbox{margin:0 0 14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--font-mono);font-size:13px;word-break:break-all;-webkit-user-select:text;user-select:text}
.linkbox a{color:var(--accent)}
.lib{width:min(640px,100%)}
.libhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.libhead h2{margin:0}
.liblist{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px;max-height:min(50vh,460px);overflow:auto}
.librow{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.librow.cur{border-color:var(--accent);background:var(--accent-soft)}
.libopen{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:8px;border:0;border-radius:10px;background:transparent;text-align:left;color:var(--ink)}
.libopen:hover{background:var(--hover)}
.libthumb{flex:none;width:96px;height:54px;border-radius:6px;border:1px solid var(--line);background:#fff;object-fit:cover}
.libtxt{min-width:0;display:grid;gap:3px}
.libname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libmeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.libtag{font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 8px}
.libacts{display:flex;gap:2px;padding-right:6px;flex:none}
.libacts .btn.confirm{width:auto;padding:0 10px;background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600;font-size:13px}
.librow input.field{height:30px;font-family:var(--font-ui);font-size:14px;font-weight:600}
.libempty{margin:0 0 12px;text-align:center}
@media (max-width:1279px){.top .btn:not(#btnPresent) .lbl{display:none}}
@media (max-width:520px){.libthumb{width:56px;height:32px}.libopen{gap:8px}.libname{white-space:normal;overflow-wrap:anywhere}}
.dlg .note{margin:0 0 8px;font-size:13px}
.dlg ol{margin:0 0 16px;padding-left:22px;color:var(--ink)}
.dlg ol li{margin:0 0 8px;line-height:1.4}
.help dl{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0 0 14px}
.help dt{color:var(--ink)}
.help dd{margin:0;text-align:right}
.help dd kbd{margin-left:4px}
.help h3{margin:12px 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Mode présentation */
.pbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:4px;z-index:20;opacity:.92}
#app.present{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"stage"}
#app.present .top,#app.present .rail,#app.present .pages,#app.present .props{display:none}
#app.present .zoom{display:none}
#app.present .toast{bottom:auto;top:16px}
.updbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 140px);display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:6px 10px;padding:6px 6px 6px 14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:7;font-size:13px}
.updbar .btn{height:34px;min-width:34px;justify-content:center}
.updbar .short{display:none}
.updbar span{white-space:nowrap}
.updbar .btn{flex:none}
.updbar:not([hidden]) ~ .toast{bottom:84px}
#app.present .updbar{bottom:auto;top:16px}
#app.present .updbar:not([hidden]) ~ .toast{top:84px}
#app.present ~ .pbar{display:flex}
.pbar .pct{font-family:var(--font-mono);font-size:12px;min-width:4em;text-align:center}
.pbar .tool{width:38px;height:38px}

@media (max-width:360px){.top{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}}
@media (max-width:900px){
  .save{display:none}
  .top{gap:3px}
  #btnPresent .lbl{display:none}
}
@media (max-width:760px){
  .top{gap:2px}
  .top .btn{padding:0 6px}
  .top .sep,.chev{display:none}
  .narrow-only{display:block}
  .menu{position:fixed;left:8px;right:8px;top:calc(54px + env(safe-area-inset-top,0px));min-width:0}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px minmax(0,1fr) auto auto;grid-template-areas:"head" "stage" "pages" "rail"}
  .rail{flex-direction:row;justify-content:flex-start;padding:4px 8px;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding-left:max(8px,env(safe-area-inset-left,0px))}
  .rail .sep{width:1px;height:26px;margin:0 4px}
  .pages{flex-direction:row;border-left:0;border-top:1px solid var(--line);max-height:104px;align-items:stretch;padding-right:0}
  .pages-head{flex-direction:column;align-items:flex-start;justify-content:center;border-bottom:0;border-right:1px solid var(--line);flex-wrap:nowrap;width:auto;padding:4px 6px}
  .pages-head .grp{display:flex;flex-wrap:wrap;width:110px}
  .pages-head .btn{height:34px;min-width:34px;justify-content:center}
  .pages-head .lab{display:none}
  .thumbs{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px 12px;align-items:flex-start}
  .brand .wordmark{display:none}
  .name{display:none}
  .btn .lbl{display:none}
  .props{top:6px;padding:5px 8px;gap:4px 10px}
  input[type=range]{width:90px}
  .zoom{bottom:8px;right:8px}
  .updbar{bottom:54px;max-width:calc(100% - 16px);flex-wrap:nowrap}
  .updbar .long{display:none}
  .updbar .short{display:inline}
  .updbar:not([hidden]) ~ .toast{bottom:112px}
}
/* Outils de classe : minuteur, tirage au sort, rideau */
.wdg{position:absolute;z-index:8;width:min(320px,calc(100% - 20px));max-height:calc(100% - 20px);display:flex;flex-direction:column;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.wdg-draw{width:min(360px,calc(100% - 20px))}
.wdg-head{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 12px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.wdg-head:active{cursor:grabbing}
.wdg-title{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600;white-space:nowrap}
.wdg-title svg{color:var(--accent)}
.wdg-btns{display:flex;gap:2px;flex:none}
.wdg-btns .btn{width:30px;height:30px;padding:0;justify-content:center}
.wdg-body{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.wdg .lab{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.wdg .note{margin:0;font-size:12px;color:var(--muted)}
.wdg .note.warn{color:var(--warn)}
.wdg .field,.wdg select,.wdg .dr-ta{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 10px;height:36px;-webkit-user-select:text;user-select:text}
.wdg .dr-ta{height:auto;min-height:150px;padding:8px 10px;resize:vertical;line-height:1.5}
.wdg .field:focus,.wdg select:focus,.wdg .dr-ta:focus{border-color:var(--accent);outline:none}
.wdg .btn.sq{width:34px;height:34px}
.wdg .btn.primary,.wdg .tm-pre .btn,.wdg .tm-adj .btn{justify-content:center}
.wdg .btn.confirm{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.wdg .chk{display:flex;align-items:center;gap:8px;font-size:13px}
.wdg .chk input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.tm-time{font-family:var(--font-mono);font-weight:500;font-size:62px;line-height:1.05;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;padding:6px 0 0}
.tm-bar{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.tm-bar i{display:block;height:100%;background:var(--accent);transform-origin:left center}
.tm-msg{min-height:1.4em;text-align:center;font-weight:600;color:var(--danger)}
.tm-main{display:flex;gap:8px}
.tm-go{flex:1;height:42px;font-size:15px}
.tm-main .btn.sq{height:42px;width:42px}
.tm-pre,.tm-adj{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wdg-timer.warn .tm-time{color:var(--warn)}.wdg-timer.warn .tm-bar i{background:var(--warn)}
.wdg-timer.crit .tm-time,.wdg-timer.done .tm-time{color:var(--danger)}.wdg-timer.crit .tm-bar i,.wdg-timer.done .tm-bar i{background:var(--danger)}
.wdg-timer.done{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 35%,transparent),var(--shadow)}
.wdg-timer.big{width:min(600px,calc(100% - 20px))}
.wdg-timer.big .tm-time{font-size:min(150px,26vw)}
.wdg-timer.big .tm-bar{height:12px}
.dr-seg{display:flex;gap:4px;background:var(--hover);padding:3px;border-radius:10px}
.dr-seg button{flex:1;border:0;border-radius:8px;padding:6px;background:transparent;font-weight:500}
.dr-seg button[aria-pressed="true"]{background:var(--panel-2);box-shadow:0 1px 2px rgba(20,30,50,.18)}
.dr-top{display:flex;gap:6px;align-items:center}
.dr-top select{flex:1;min-width:0;height:34px}
.dr-out{min-height:96px;display:grid;place-items:center;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:12px;font-family:var(--font-brand);font-weight:700;overflow-wrap:anywhere;line-height:1.15}
.dr-out.win{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.dr-pick{height:42px;font-size:15px;justify-content:center}
.dr-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dr-step{display:flex;align-items:center;gap:8px}
.dr-step>span:first-child{flex:1}
.dr-n{min-width:1.6em;text-align:center;color:var(--ink);font-size:15px}
.dr-chips{display:flex;flex-wrap:wrap;gap:5px;max-height:132px;overflow:auto;padding:2px}
.chip{max-width:100%;overflow-wrap:anywhere;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:3px 10px;font-size:13px;line-height:1.3}
.chip:hover{background:var(--hover)}
.chip.drawn{opacity:.55}.chip.drawn::before{content:"✓ "}
.chip.absent{text-decoration:line-through;opacity:.45;background:var(--hover)}
.gr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.gr-card{min-width:0;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);font-size:13px;line-height:1.5}
.gr-card h4{margin:0 0 3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.dr-acts{display:flex;flex-wrap:wrap;gap:8px}
.menu [data-cls] svg.i{width:18px;height:18px;color:var(--accent)}
.menu .mr{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.menu .cls-qr{display:none}
.pbar .menu{position:absolute;left:50%;right:auto;top:auto;bottom:calc(100% + 10px);transform:translateX(-50%);min-width:min(250px,92vw)}
.curtain{position:absolute;z-index:4;background-color:#27303f;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 3px,transparent 3px 30px)}
.curtain[data-edge="bottom"]{left:0;right:0;bottom:0;height:calc(var(--cov) * 100%);min-height:34px;box-shadow:0 -8px 20px rgba(0,0,0,.35)}
.curtain[data-edge="top"]{left:0;right:0;top:0;height:calc(var(--cov) * 100%);min-height:34px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.curtain[data-edge="left"]{top:0;bottom:0;left:0;width:calc(var(--cov) * 100%);min-width:34px;box-shadow:8px 0 20px rgba(0,0,0,.35)}
.curtain[data-edge="right"]{top:0;bottom:0;right:0;width:calc(var(--cov) * 100%);min-width:34px;box-shadow:-8px 0 20px rgba(0,0,0,.35)}
.cu-grip{position:absolute;background:#3a4659;touch-action:none;display:block}
.curtain[data-edge="bottom"] .cu-grip{left:0;right:0;top:0;height:34px;cursor:ns-resize}
.curtain[data-edge="top"] .cu-grip{left:0;right:0;bottom:0;height:34px;cursor:ns-resize}
.curtain[data-edge="left"] .cu-grip{top:0;bottom:0;right:0;width:34px;cursor:ew-resize}
.curtain[data-edge="right"] .cu-grip{top:0;bottom:0;left:0;width:34px;cursor:ew-resize}
.cu-dots{position:absolute;left:50%;top:50%;width:44px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);transform:translate(-50%,-50%);pointer-events:none}
.curtain[data-edge="left"] .cu-dots,.curtain[data-edge="right"] .cu-dots{width:6px;height:44px}
.cu-ctl{position:absolute;display:flex;gap:2px}
.curtain[data-edge="top"] .cu-ctl,.curtain[data-edge="bottom"] .cu-ctl{left:6px;top:3px}
.curtain[data-edge="left"] .cu-ctl,.curtain[data-edge="right"] .cu-ctl{top:6px;left:3px;flex-direction:column}
.cu-ctl .btn{width:28px;height:28px;padding:0;justify-content:center;color:#e8ecf3;border-radius:7px}
.cu-ctl .btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.cu-ctl .btn[aria-pressed="true"]{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4);color:#fff}
.cu-hint{position:absolute;inset:0;margin:0;display:none;place-items:center;text-align:center;padding:48px 20px;color:rgba(255,255,255,.6);font-size:15px;pointer-events:none}
.curtain.full .cu-hint{display:grid}
@media (max-width:520px){#btnQr{display:none}.menu .cls-qr{display:flex}.wdg-timer .tm-time{font-size:54px}.wdg-timer.big .tm-time{font-size:min(110px,24vw)}}
@media (prefers-reduced-motion: no-preference){
  @keyframes tmflash{50%{background:color-mix(in srgb,var(--danger) 16%,var(--panel-2))}}
  .wdg-timer.done{animation:tmflash 1s ease-in-out 8}
  @keyframes drpop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
  .dr-out.win{animation:drpop .4s ease-out}
}
@media (prefers-reduced-motion: no-preference){
  .tool,.btn,.swatch{transition:background-color .12s,box-shadow .12s}
}

function normalize(d) {
  if (!d || !Array.isArray(d.pages) || !d.pages.length) throw new Error('format');

    const f = p && p.frame;

      let q = o.id ? o : { ...o, id: uid() };

function serialize() {

}

/* ───────── Géométrie des objets ───────── */
let bCache = new WeakMap(), rbCache = new WeakMap(), tbCache = new WeakMap();

function rawBounds(o) {                                              // cadre de l'objet avant rotation

      for (const p of o.pts) { if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }

    }
